
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Task Manager</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #eaf2ff;
      color: #1e293b;
      margin: 0;
      padding: 30px 15px;
    }

    .container {
      max-width: 750px;
      margin: 0 auto;
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(30, 64, 175, 0.10);
    }

    h1 {
      text-align: center;
      color: #1d4ed8;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 140px 140px auto;
      gap: 10px;
      margin-bottom: 20px;
    }

    input, select, button {
      font: inherit;
      padding: 11px;
      border-radius: 8px;
    }

    input, select {
      min-width: 0;
      border: 1px solid #cbd5e1;
      background: white;
    }

    button {
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      background: #eff6ff;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .filter-btn {
      background: #e2e8f0;
      color: #334155;
    }

    .filter-btn:hover {
      background: #cbd5e1;
    }

    .filter-btn.active {
      background: #2563eb;
      color: white;
    }

    #taskList {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .task {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 15px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .task input[type="checkbox"] {
      margin-top: 4px;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .task-info {
      flex: 1;
      min-width: 0;
    }

    .task-name {
      overflow-wrap: anywhere;
      font-weight: bold;
    }

    .completed .task-name {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .task-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 12px;
      color: #64748b;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 20px;
      font-weight: bold;
    }

    .High {
      background: #fee2e2;
      color: #b91c1c;
    }

    .Medium {
      background: #fef3c7;
      color: #92400e;
    }

    .Low {
      background: #dcfce7;
      color: #166534;
    }

    .delete-btn {
      background: #fee2e2;
      color: #b91c1c;
      padding: 8px 10px;
    }

    .delete-btn:hover {
      background: #fecaca;
    }

    .empty {
      text-align: center;
      color: #64748b;
      padding: 25px 5px;
    }

    @media (max-width: 650px) {
      form {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 20px;
      }

      .stats {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>My Task Manager</h1>
    <p class="subtitle">Organize your work. Track your progress.</p>

    <form id="taskForm">
      <input
        type="text"
        id="taskInput"
        placeholder="Enter a new task..."
        aria-label="Task name"
        required
      >

      <select id="taskPriority" aria-label="Task priority">
        <option value="High">High priority</option>
        <option value="Medium" selected>Medium priority</option>
        <option value="Low">Low priority</option>
      </select>

      <input
        type="date"
        id="taskDueDate"
        aria-label="Task due date"
      >

      <button type="submit">Add Task</button>
    </form>

    <section class="stats" aria-live="polite">
      <span>Total: <strong id="totalCount">0</strong></span>
      <span>Pending: <strong id="pendingCount">0</strong></span>
      <span>Completed: <strong id="completedCount">0</strong></span>
    </section>

    <div class="filters" aria-label="Filter tasks">
      <button type="button" class="filter-btn active" data-filter="All">
        All Tasks
      </button>
      <button type="button" class="filter-btn" data-filter="Pending">
        Pending
      </button>
      <button type="button" class="filter-btn" data-filter="Completed">
        Completed
      </button>
    </div>

    <ul id="taskList"></ul>
    <p id="emptyMessage" class="empty">No tasks yet. Add your first task!</p>
  </main>

  <script>
    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const taskPriority = document.getElementById("taskPriority");
    const taskDueDate = document.getElementById("taskDueDate");
    const taskList = document.getElementById("taskList");
    const emptyMessage = document.getElementById("emptyMessage");

    const totalCount = document.getElementById("totalCount");
    const pendingCount = document.getElementById("pendingCount");
    const completedCount = document.getElementById("completedCount");

    const filterButtons = document.querySelectorAll(".filter-btn");

    let currentFilter = "All";
    let tasks = loadTasks();

    function loadTasks() {
      try {
        const saved = JSON.parse(
          localStorage.getItem("myTaskManagerTasks")
        );

        if (!Array.isArray(saved)) {
          return [];
        }

        return saved
          .filter(task => task && typeof task.text === "string")
          .map(task => ({
            id: task.id ?? (Date.now() + Math.random()),
            text: task.text,
            completed: Boolean(task.completed),
            priority: ["High", "Medium", "Low"].includes(task.priority)
              ? task.priority
              : "Medium",
            dueDate: typeof task.dueDate === "string"
              ? task.dueDate
              : ""
          }));
      } catch (error) {
        return [];
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(
          "myTaskManagerTasks",
          JSON.stringify(tasks)
        );
      } catch (error) {
        alert("Could not save tasks in this browser.");
      }
    }

    function renderTasks() {
      taskList.replaceChildren();

      totalCount.textContent = tasks.length;
      pendingCount.textContent =
        tasks.filter(task => !task.completed).length;
      completedCount.textContent =
        tasks.filter(task => task.completed).length;

      const filteredTasks = tasks.filter(task => {
        if (currentFilter === "Pending") {
          return !task.completed;
        }

        if (currentFilter === "Completed") {
          return task.completed;
        }

        return true;
      });

      emptyMessage.style.display =
        filteredTasks.length === 0 ? "block" : "none";

      if (filteredTasks.length === 0) {
        emptyMessage.textContent = tasks.length === 0
          ? "No tasks yet. Add your first task!"
          : "No tasks in this filter.";
      }

      filteredTasks.forEach(task => {
        const item = document.createElement("li");
        item.className = "task" + (task.completed ? " completed" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", "Mark task completed");

        checkbox.addEventListener("change", () => {
          task.completed = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const info = document.createElement("div");
        info.className = "task-info";

        const name = document.createElement("div");
        name.className = "task-name";
        name.textContent = task.text;

        const meta = document.createElement("div");
        meta.className = "task-meta";

        const priority = document.createElement("span");
        priority.className = "badge " + task.priority;
        priority.textContent = task.priority + " priority";
        meta.appendChild(priority);

        if (task.dueDate) {
          const due = document.createElement("span");
          due.textContent = "Due: " + task.dueDate;
          meta.appendChild(due);
        }

        info.append(name, meta);

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "Delete";
        deleteButton.setAttribute("aria-label", "Delete " + task.text);

        deleteButton.addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          saveTasks();
          renderTasks();
        });

        item.append(checkbox, info, deleteButton);
        taskList.appendChild(item);
      });
    }

    taskForm.addEventListener("submit", event => {
      event.preventDefault();

      const text = taskInput.value.trim();

      if (!text) {
        return;
      }

      tasks.push({
        id: Date.now() + Math.random(),
        text: text,
        completed: false,
        priority: taskPriority.value,
        dueDate: taskDueDate.value
      });

      saveTasks();
      taskForm.reset();
      taskPriority.value = "Medium";
      taskInput.focus();
      renderTasks();
    });

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;

        filterButtons.forEach(filterButton => {
          const isActive = filterButton === button;
          filterButton.classList.toggle("active", isActive);
          filterButton.setAttribute("aria-pressed", String(isActive));
        });

        renderTasks();
      });
    });

    filterButtons.forEach(button => {
      button.setAttribute(
        "aria-pressed",
        String(button.dataset.filter === currentFilter)
      );
    });

    renderTasks();
  </script>
</body>
</html>
