
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Task Manager</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #eaf2ff;
      color: #1e293b;
      margin: 0;
      padding: 30px 15px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(30, 64, 175, 0.10);
    }

    h1 { text-align: center; color: #1d4ed8; margin-top: 0; }
    .subtitle { text-align: center; color: #64748b; margin-bottom: 25px; }

    form {
      display: grid;
      grid-template-columns: 1fr 140px 140px auto;
      gap: 10px;
      margin-bottom: 20px;
    }

    input, select, button {
      font: inherit;
      padding: 11px;
      border-radius: 8px;
    }

    input, select {
      min-width: 0;
      border: 1px solid #cbd5e1;
      background: white;
    }

    button {
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    button:hover { background: #1d4ed8; }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      background: #eff6ff;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    .search-box { width: 100%; margin-bottom: 16px; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .filters { display: flex; gap: 8px; flex-wrap: wrap; }

    .filter-btn { background: #e2e8f0; color: #334155; }
    .filter-btn:hover { background: #cbd5e1; }
    .filter-btn.active { background: #2563eb; color: white; }

    .sort-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sort-control select { max-width: 210px; }

    #taskList { list-style: none; padding: 0; margin: 0; }

    .task {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 15px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .task input[type="checkbox"] {
      margin-top: 4px;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .task-info { flex: 1; min-width: 0; }
    .task-name { font-weight: bold; overflow-wrap: anywhere; }

    .completed .task-name {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .task-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 12px;
      color: #64748b;
    }

    .badge { padding: 4px 8px; border-radius: 20px; font-weight: bold; }
    .High { background: #fee2e2; color: #b91c1c; }
    .Medium { background: #fef3c7; color: #92400e; }
    .Low { background: #dcfce7; color: #166534; }

    .task-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .edit-btn { background: #dbeafe; color: #1d4ed8; padding: 8px 10px; }
    .edit-btn:hover { background: #bfdbfe; }
    .delete-btn { background: #fee2e2; color: #b91c1c; padding: 8px 10px; }
    .delete-btn:hover { background: #fecaca; }

    .empty { text-align: center; color: #64748b; padding: 25px 5px; }

    .edit-panel {
      margin-top: 10px;
      padding: 12px;
      border: 1px solid #bfdbfe;
      background: #f8fbff;
      border-radius: 10px;
    }

    .edit-panel input, .edit-panel select {
      width: 100%;
      margin-bottom: 8px;
    }

    .edit-actions { display: flex; gap: 8px; }
    .cancel-btn { background: #e2e8f0; color: #334155; }

    @media (max-width: 700px) {
      form { grid-template-columns: 1fr; }
      .container { padding: 20px; }
      .stats { flex-direction: column; }
      .task { flex-wrap: wrap; }
      .task-info { min-width: 60%; }
      .task-actions { margin-left: 30px; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .sort-control { justify-content: space-between; }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>My Task Manager</h1>
    <p class="subtitle">Organize your work. Track your progress.</p>

    <form id="taskForm">
      <input type="text" id="taskInput" placeholder="Enter a new task..."
        aria-label="Task name" maxlength="200" required>

      <select id="taskPriority" aria-label="Task priority">
        <option value="High">High priority</option>
        <option value="Medium" selected>Medium priority</option>
        <option value="Low">Low priority</option>
      </select>

      <input type="date" id="taskDueDate" aria-label="Task due date">
      <button type="submit">Add Task</button>
    </form>

    <section class="stats" aria-live="polite">
      <span>Total: <strong id="totalCount">0</strong></span>
      <span>Pending: <strong id="pendingCount">0</strong></span>
      <span>Completed: <strong id="completedCount">0</strong></span>
    </section>

    <input type="search" id="searchInput" class="search-box"
      placeholder="Search tasks..." aria-label="Search tasks">

    <div class="toolbar">
      <div class="filters" aria-label="Filter tasks">
        <button type="button" class="filter-btn active" data-filter="All">All Tasks</button>
        <button type="button" class="filter-btn" data-filter="Pending">Pending</button>
        <button type="button" class="filter-btn" data-filter="Completed">Completed</button>
      </div>

      <label class="sort-control">
        <span>Sort by:</span>
        <select id="sortSelect" aria-label="Sort tasks">
          <option value="created">Recently added</option>
          <option value="priority">Priority</option>
          <option value="dueDate">Due date</option>
          <option value="name">Task name (A-Z)</option>
        </select>
      </label>
    </div>

    <ul id="taskList"></ul>
    <p id="emptyMessage" class="empty">No tasks yet. Add your first task!</p>
  </main>

  <script>
    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const taskPriority = document.getElementById("taskPriority");
    const taskDueDate = document.getElementById("taskDueDate");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");
    const taskList = document.getElementById("taskList");
    const emptyMessage = document.getElementById("emptyMessage");

    const totalCount = document.getElementById("totalCount");
    const pendingCount = document.getElementById("pendingCount");
    const completedCount = document.getElementById("completedCount");
    const filterButtons = document.querySelectorAll(".filter-btn");

    let currentFilter = "All";
    let tasks = loadTasks();

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem("myTaskManagerTasks"));
        if (!Array.isArray(saved)) return [];

        return saved
          .filter(task => task && typeof task.text === "string")
          .map((task, index) => ({
            id: task.id ?? (Date.now() + index + Math.random()),
            text: task.text,
            completed: Boolean(task.completed),
            priority: ["High", "Medium", "Low"].includes(task.priority)
              ? task.priority : "Medium",
            dueDate: typeof task.dueDate === "string" ? task.dueDate : "",
            createdAt: Number.isFinite(task.createdAt)
              ? task.createdAt : index
          }));
      } catch (error) {
        return [];
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem("myTaskManagerTasks", JSON.stringify(tasks));
      } catch (error) {
        alert("Could not save tasks in this browser.");
      }
    }

    function renderTasks() {
      taskList.replaceChildren();

      totalCount.textContent = tasks.length;
      pendingCount.textContent = tasks.filter(task => !task.completed).length;
      completedCount.textContent = tasks.filter(task => task.completed).length;

      const searchText = searchInput.value.trim().toLowerCase();
      const priorityRank = { High: 0, Medium: 1, Low: 2 };

      const filteredTasks = tasks.filter(task => {
        const matchesSearch = task.text.toLowerCase().includes(searchText);

        const matchesStatus =
          currentFilter === "All" ||
          (currentFilter === "Pending" && !task.completed) ||
          (currentFilter === "Completed" && task.completed);

        return matchesSearch && matchesStatus;
      });

      filteredTasks.sort((a, b) => {
        switch (sortSelect.value) {
          case "priority":
            return priorityRank[a.priority] - priorityRank[b.priority]
              || b.createdAt - a.createdAt;

          case "dueDate":
            if (!a.dueDate && !b.dueDate) return b.createdAt - a.createdAt;
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return a.dueDate.localeCompare(b.dueDate);

          case "name":
            return a.text.localeCompare(b.text, undefined, {
              sensitivity: "base"
            });

          default:
            return b.createdAt - a.createdAt;
        }
      });

      emptyMessage.style.display = filteredTasks.length === 0 ? "block" : "none";

      if (filteredTasks.length === 0) {
        emptyMessage.textContent = tasks.length === 0
          ? "No tasks yet. Add your first task!"
          : searchText
            ? "No tasks match your search."
            : "No tasks in this filter.";
      }

      filteredTasks.forEach(task => {
        const item = document.createElement("li");
        item.className = "task" + (task.completed ? " completed" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", "Mark task completed");

        checkbox.addEventListener("change", () => {
          task.completed = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const info = document.createElement("div");
        info.className = "task-info";

        const name = document.createElement("div");
        name.className = "task-name";
        name.textContent = task.text;

        const meta = document.createElement("div");
        meta.className = "task-meta";

        const priority = document.createElement("span");
        priority.className = "badge " + task.priority;
        priority.textContent = task.priority + " priority";
        meta.appendChild(priority);

        if (task.dueDate) {
          const due = document.createElement("span");
          due.textContent = "Due: " + task.dueDate;
          meta.appendChild(due);
        }

        info.append(name, meta);

        const actions = document.createElement("div");
        actions.className = "task-actions";

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "edit-btn";
        editButton.textContent = "Edit";

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "Delete";
        deleteButton.setAttribute("aria-label", "Delete " + task.text);

        editButton.addEventListener("click", () => {
          const existingPanel = item.querySelector(".edit-panel");

          if (existingPanel) {
            existingPanel.remove();
            editButton.textContent = "Edit";
            return;
          }

          const panel = document.createElement("div");
          panel.className = "edit-panel";

          const editName = document.createElement("input");
          editName.type = "text";
          editName.value = task.text;
          editName.maxLength = 200;
          editName.setAttribute("aria-label", "Edit task name");
          editName.required = true;

          const editPriority = document.createElement("select");
          editPriority.setAttribute("aria-label", "Edit priority");

          ["High", "Medium", "Low"].forEach(value => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = value + " priority";
            editPriority.appendChild(option);
          });
          editPriority.value = task.priority;

          const editDueDate = document.createElement("input");
          editDueDate.type = "date";
          editDueDate.value = task.dueDate;
          editDueDate.setAttribute("aria-label", "Edit due date");

          const editActions = document.createElement("div");
          editActions.className = "edit-actions";

          const saveButton = document.createElement("button");
          saveButton.type = "button";
          saveButton.textContent = "Save changes";

          const cancelButton = document.createElement("button");
          cancelButton.type = "button";
          cancelButton.className = "cancel-btn";
          cancelButton.textContent = "Cancel";

          saveButton.addEventListener("click", () => {
            const newName = editName.value.trim();

            if (!newName) {
              alert("Task name cannot be empty.");
              editName.focus();
              return;
            }

            task.text = newName;
            task.priority = editPriority.value;
            task.dueDate = editDueDate.value;

            saveTasks();
            renderTasks();
          });

          cancelButton.addEventListener("click", () => {
            panel.remove();
            editButton.textContent = "Edit";
          });

          editActions.append(saveButton, cancelButton);
          panel.append(editName, editPriority, editDueDate, editActions);
          info.appendChild(panel);

          editButton.textContent = "Close";
          editName.focus();
        });

        deleteButton.addEventListener("click", () => {
          tasks = tasks.filter(entry => entry.id !== task.id);
          saveTasks();
          renderTasks();
        });

        actions.append(editButton, deleteButton);
        item.append(checkbox, info, actions);
        taskList.appendChild(item);
      });
    }

    taskForm.addEventListener("submit", event => {
      event.preventDefault();

      const text = taskInput.value.trim();
      if (!text) return;

      tasks.push({
        id: Date.now() + Math.random(),
        text,
        completed: false,
        priority: taskPriority.value,
        dueDate: taskDueDate.value,
        createdAt: Date.now()
      });

      saveTasks();
      taskForm.reset();
      taskPriority.value = "Medium";
      taskInput.focus();
      renderTasks();
    });

    searchInput.addEventListener("input", renderTasks);
    sortSelect.addEventListener("change", renderTasks);

    filterButtons.forEach(button => {
      button.setAttribute(
        "aria-pressed",
        String(button.dataset.filter === currentFilter)
      );

      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;

        filterButtons.forEach(filterButton => {
          const active = filterButton === button;
          filterButton.classList.toggle("active", active);
          filterButton.setAttribute("aria-pressed", String(active));
        });

        renderTasks();
      });
    });

    renderTasks();
  </script>
</body>
</html>
