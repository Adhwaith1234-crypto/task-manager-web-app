
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow - Smart Task Manager</title>

<style>
:root {
    --page: #f1f5f9;
    --surface: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --input: #ffffff;
    --shadow: 0 5px 20px rgba(15, 23, 42, 0.07);
}

body.dark-mode {
    color-scheme: dark;
    --page: #0f172a;
    --surface: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: #334155;
    --primary: #818cf8;
    --primary-hover: #6366f1;
    --input: #0f172a;
    --shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 0;
    background: var(--page);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    transition: background 0.25s, color 0.25s;
}

button, input, select {
    font: inherit;
}

button {
    cursor: pointer;
}

.container {
    width: 92%;
    max-width: 1050px;
    margin: 15px auto;
}

header {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    padding: 28px;
    border-radius: 18px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
}

.header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

header h1 {
    margin: 0 0 8px;
    font-size: 30px;
}

header p {
    margin: 0;
    opacity: 0.9;
}

#themeBtn {
    background: rgba(255,255,255,0.17);
    color: white;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 10px;
    padding: 10px 14px;
    white-space: nowrap;
}

.panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
}

.panel h2 {
    font-size: 19px;
    margin: 0 0 16px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

.stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 19px;
    box-shadow: var(--shadow);
}

.stat-label {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 9px;
}

.stat-number {
    font-size: 29px;
    font-weight: bold;
}

.progress-track, .priority-track {
    background: var(--border);
    height: 10px;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 12px;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: #22c55e;
    transition: width 0.3s;
}

.priority-fill {
    height: 100%;
    width: 0%;
    transition: width 0.3s;
}

.high-fill { background: #ef4444; }
.medium-fill { background: #f59e0b; }
.low-fill { background: #22c55e; }

.priority-row {
    margin: 15px 0;
}

.priority-heading {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 7px;
    font-size: 14px;
}

.form-grid {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(120px, 1fr)
        minmax(135px, 1fr);
    gap: 12px;
}

input, select {
    width: 100%;
    min-width: 0;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--input);
    color: var(--text);
    outline: none;
}

input:focus, select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
}

.primary-btn, .secondary-btn, .danger-btn {
    border: none;
    border-radius: 9px;
    padding: 11px 15px;
    font-weight: 600;
}

.primary-btn {
    background: var(--primary);
    color: white;
}

.primary-btn:hover {
    background: var(--primary-hover);
}

.secondary-btn {
    background: var(--border);
    color: var(--text);
}

.danger-btn {
    background: #fee2e2;
    color: #b91c1c;
}

#taskForm .primary-btn {
    width: 100%;
    margin-top: 12px;
}

.toolbar {
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 15px;
}

.toolbar-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.toolbar-bottom p {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
}

.task-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.task {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 15px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
}

.task.completed {
    opacity: 0.72;
}

.task.completed .task-name {
    text-decoration: line-through;
    color: var(--muted);
}

.task-check {
    width: 19px;
    height: 19px;
    margin-top: 3px;
    flex-shrink: 0;
    accent-color: var(--primary);
    cursor: pointer;
}

.task-content {
    flex: 1;
    min-width: 0;
}

.task-name {
    font-weight: 600;
    overflow-wrap: anywhere;
    line-height: 1.5;
}

.task-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    margin-top: 9px;
    font-size: 12px;
}

.tag {
    padding: 5px 8px;
    border-radius: 20px;
    font-weight: 600;
}

.priority-high { background: #fee2e2; color: #b91c1c; }
.priority-medium { background: #fef3c7; color: #92400e; }
.priority-low { background: #dcfce7; color: #166534; }

.status-overdue { background: #fee2e2; color: #b91c1c; }
.status-today { background: #ffedd5; color: #9a3412; }
.status-upcoming { background: #dbeafe; color: #1d4ed8; }
.status-completed { background: #dcfce7; color: #166534; }
.status-no-date { background: var(--border); color: var(--muted); }

.task-actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.task-actions button {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 7px;
    padding: 7px 9px;
    font-size: 12px;
}

.task-actions .delete-btn {
    color: #dc2626;
}

.empty-state {
    text-align: center;
    color: var(--muted);
    padding: 35px 10px;
}

footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 10px;
}

@media (max-width: 700px) {
    .container { width: 95%; }
    header { padding: 20px; }
    header h1 { font-size: 24px; }
    .header-row { align-items: flex-start; }
    .dashboard { grid-template-columns: 1fr; }
    .form-grid, .toolbar { grid-template-columns: 1fr; }
    .task { flex-wrap: wrap; }
    .task-actions { width: 100%; padding-left: 31px; }
}

@media (max-width: 380px) {
    .header-row { flex-direction: column; }
}
</style>
</head>

<body>
<div class="container">

    <header>
        <div class="header-row">
            <div>
                <h1>TaskFlow</h1>
                <p>Your tasks, organised intelligently.</p>
            </div>
            <button id="themeBtn" type="button">🌙 Dark Mode</button>
        </div>
    </header>

    <section class="dashboard">
        <div class="stat-card">
            <div class="stat-label">Total Tasks</div>
            <div class="stat-number" id="totalCount">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Completed Tasks</div>
            <div class="stat-number" id="completedCount">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Pending Tasks</div>
            <div class="stat-number" id="pendingCount">0</div>
        </div>
    </section>

    <section class="panel">
        <h2>Overall Progress</h2>
        <div id="progressText">0% completed</div>
        <div
            class="progress-track"
            role="progressbar"
            id="progressBar"
            aria-label="Task completion progress"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
        >
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </section>

    <section class="panel">
        <h2>Priority Overview</h2>

        <div class="priority-row">
            <div class="priority-heading">
                <span>🔴 High Priority</span>
                <span id="highCount">0</span>
            </div>
            <div class="priority-track">
                <div class="priority-fill high-fill" id="highBar"></div>
            </div>
        </div>

        <div class="priority-row">
            <div class="priority-heading">
                <span>🟠 Medium Priority</span>
                <span id="mediumCount">0</span>
            </div>
            <div class="priority-track">
                <div class="priority-fill medium-fill" id="mediumBar"></div>
            </div>
        </div>

        <div class="priority-row">
            <div class="priority-heading">
                <span>🟢 Low Priority</span>
                <span id="lowCount">0</span>
            </div>
            <div class="priority-track">
                <div class="priority-fill low-fill" id="lowBar"></div>
            </div>
        </div>
    </section>

    <section class="panel">
        <h2 id="formHeading">Add a New Task</h2>

        <form id="taskForm">
            <div class="form-grid">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter your task..."
                    maxlength="200"
                    required
                >

                <select id="priorityInput" aria-label="Task priority">
                    <option value="High">High Priority</option>
                    <option value="Medium" selected>Medium Priority</option>
                    <option value="Low">Low Priority</option>
                </select>

                <input
                    type="date"
                    id="dueDateInput"
                    aria-label="Task due date"
                >
            </div>

            <button type="submit" class="primary-btn" id="submitBtn">
                + Add Task
            </button>
            <button
                type="button"
                class="secondary-btn"
                id="cancelEditBtn"
                hidden
                style="margin-top: 10px;"
            >
                Cancel Edit
            </button>
        </form>
    </section>

    <section class="panel">
        <h2>Your Tasks</h2>

        <div class="toolbar">
            <input
                type="search"
                id="searchInput"
                placeholder="Search tasks..."
                aria-label="Search tasks"
            >

            <select id="filterInput" aria-label="Filter tasks">
                <option value="all">All Tasks</option>
                <option value="pending">Pending Tasks</option>
                <option value="completed">Completed Tasks</option>
            </select>

            <select id="sortInput" aria-label="Sort tasks">
                <option value="recent">Recently Added</option>
                <option value="priority">Priority: High to Low</option>
                <option value="dueDate">Due Date: Earliest First</option>
                <option value="name">Task Name: A–Z</option>
            </select>
        </div>

        <div class="toolbar-bottom">
            <p id="resultCount">Showing 0 tasks</p>
            <button type="button" class="secondary-btn" id="exportBtn">
                ↓ Export CSV
            </button>
        </div>

        <div id="taskList" class="task-list"></div>
    </section>

    <footer>
        TaskFlow — Plan smarter. Work better.
    </footer>

</div>

<script>
"use strict";

/*
 * Preserve the existing storage key so previously saved tasks
 * can be loaded when their data uses the expected format.
 */
const STORAGE_KEY = "myTaskManagerTasks";
const THEME_KEY = "taskFlowTheme";

const taskForm = document.getElementById("taskForm");
const taskInput = document.getElementById("taskInput");
const priorityInput = document.getElementById("priorityInput");
const dueDateInput = document.getElementById("dueDateInput");
const taskList = document.getElementById("taskList");
const searchInput = document.getElementById("searchInput");
const filterInput = document.getElementById("filterInput");
const sortInput = document.getElementById("sortInput");
const submitBtn = document.getElementById("submitBtn");
const formHeading = document.getElementById("formHeading");
const cancelEditBtn = document.getElementById("cancelEditBtn");
const themeBtn = document.getElementById("themeBtn");

let tasks = loadTasks();
let editingId = null;
let nextId = Math.max(0, ...tasks.map(task => task.id)) + 1;

/* Load tasks safely from localStorage. */
function loadTasks() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) return [];

        const parsed = JSON.parse(saved);

        if (!Array.isArray(parsed)) return [];

        return parsed
            .filter(task =>
                task &&
                typeof task.text === "string" &&
                typeof task.completed === "boolean"
            )
            .map(task => ({
                id: Number.isFinite(Number(task.id))
                    ? Number(task.id)
                    : Date.now() + Math.random(),
                text: task.text,
                completed: task.completed,
                priority: ["High", "Medium", "Low"].includes(task.priority)
                    ? task.priority
                    : "Medium",
                dueDate: typeof task.dueDate === "string"
                    ? task.dueDate
                    : "",
                createdAt: Number.isFinite(Number(task.createdAt))
                    ? Number(task.createdAt)
                    : Date.now()
            }));
    } catch (error) {
        console.error("Could not load saved tasks:", error);
        return [];
    }
}

/* Save tasks in the browser. */
function saveTasks() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (error) {
        alert("Tasks could not be saved in this browser. Check storage settings.");
        console.error("Could not save tasks:", error);
    }
}

/* Apply saved dark/light mode. */
function applyTheme() {
    let theme = "light";

    try {
        theme = localStorage.getItem(THEME_KEY) || "light";
    } catch (error) {
        console.error("Could not read theme preference:", error);
    }

    document.body.classList.toggle("dark-mode", theme === "dark");
    themeBtn.textContent = theme === "dark"
        ? "☀️ Light Mode"
        : "🌙 Dark Mode";
}

themeBtn.addEventListener("click", function () {
    const isDark = document.body.classList.toggle("dark-mode");
    themeBtn.textContent = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";

    try {
        localStorage.setItem(THEME_KEY, isDark ? "dark" : "light");
    } catch (error) {
        console.error("Could not save theme preference:", error);
    }
});

/* Create or update a task. */
taskForm.addEventListener("submit", function (event) {
    event.preventDefault();

    const text = taskInput.value.trim();

    if (!text) {
        alert("Please enter a task name.");
        taskInput.focus();
        return;
    }

    if (editingId !== null) {
        const task = tasks.find(item => item.id === editingId);

        if (task) {
            task.text = text;
            task.priority = priorityInput.value;
            task.dueDate = dueDateInput.value;
        }

        editingId = null;
        resetForm();
    } else {
        tasks.push({
            id: nextId++,
            text: text,
            completed: false,
            priority: priorityInput.value,
            dueDate: dueDateInput.value,
            createdAt: Date.now()
        });

        taskForm.reset();
        priorityInput.value = "Medium";
    }

    saveTasks();
    render();
    taskInput.focus();
});

function resetForm() {
    editingId = null;
    taskForm.reset();
    priorityInput.value = "Medium";
    formHeading.textContent = "Add a New Task";
    submitBtn.textContent = "+ Add Task";
    cancelEditBtn.hidden = true;
}

cancelEditBtn.addEventListener("click", function () {
    resetForm();
});

/* Start editing an existing task. */
function editTask(id) {
    const task = tasks.find(item => item.id === id);
    if (!task) return;

    editingId = id;
    taskInput.value = task.text;
    priorityInput.value = task.priority;
    dueDateInput.value = task.dueDate;

    formHeading.textContent = "Edit Task";
    submitBtn.textContent = "Save Changes";
    cancelEditBtn.hidden = false;

    document.getElementById("taskForm").scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

    taskInput.focus();
}

/* Toggle completion. */
function toggleTask(id) {
    const task = tasks.find(item => item.id === id);
    if (!task) return;

    task.completed = !task.completed;
    saveTasks();
    render();
}

/* Delete a task. */
function deleteTask(id) {
    const task = tasks.find(item => item.id === id);
    if (!task) return;

    if (!confirm('Delete the task "' + task.text + '"?')) return;

    tasks = tasks.filter(item => item.id !== id);

    if (editingId === id) resetForm();

    saveTasks();
    render();
}

/* Get the task's due-date status. */
function getDueStatus(task) {
    if (task.completed) {
        return { text: "Completed", className: "status-completed" };
    }

    if (!task.dueDate) {
        return { text: "No due date", className: "status-no-date" };
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const due = new Date(task.dueDate + "T00:00:00");

    if (Number.isNaN(due.getTime())) {
        return { text: "No due date", className: "status-no-date" };
    }

    if (due < today) {
        return { text: "Overdue", className: "status-overdue" };
    }

    if (due.getTime() === today.getTime()) {
        return { text: "Due Today", className: "status-today" };
    }

    return { text: "Upcoming", className: "status-upcoming" };
}

/* Display a date in a readable format. */
function formatDate(dateString) {
    if (!dateString) return "Not set";

    const date = new Date(dateString + "T00:00:00");

    if (Number.isNaN(date.getTime())) return "Not set";

    return date.toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric"
    });
}

/* Create HTML safely: task text is inserted using textContent. */
function createTaskElement(task) {
    const article = document.createElement("article");
    article.className = "task" + (task.completed ? " completed" : "");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.className = "task-check";
    checkbox.checked = task.completed;
    checkbox.setAttribute("aria-label", "Mark task completed");
    checkbox.addEventListener("change", () => toggleTask(task.id));

    const content = document.createElement("div");
    content.className = "task-content";

    const name = document.createElement("div");
    name.className = "task-name";
    name.textContent = task.text;

    const meta = document.createElement("div");
    meta.className = "task-meta";

    const priority = document.createElement("span");
    priority.className = "tag priority-" + task.priority.toLowerCase();
    priority.textContent = task.priority + " Priority";

    const due = document.createElement("span");
    due.className = "tag status-no-date";
    due.textContent = "Due: " + formatDate(task.dueDate);

    const status = getDueStatus(task);
    const statusTag = document.createElement("span");
    statusTag.className = "tag " + status.className;
    statusTag.textContent = status.text;

    meta.append(priority, due, statusTag);
    content.append(name, meta);

    const actions = document.createElement("div");
    actions.className = "task-actions";

    const editButton = document.createElement("button");
    editButton.type = "button";
    editButton.textContent = "✏️ Edit";
    editButton.addEventListener("click", () => editTask(task.id));

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "delete-btn";
    deleteButton.textContent = "🗑 Delete";
    deleteButton.addEventListener("click", () => deleteTask(task.id));

    actions.append(editButton, deleteButton);
    article.append(checkbox, content, actions);

    return article;
}

/* Filter and sort tasks for display. */
function getVisibleTasks() {
    let visible = [...tasks];
    const search = searchInput.value.trim().toLowerCase();
    const filter = filterInput.value;
    const sort = sortInput.value;

    if (search) {
        visible = visible.filter(task =>
            task.text.toLowerCase().includes(search)
        );
    }

    if (filter === "pending") {
        visible = visible.filter(task => !task.completed);
    } else if (filter === "completed") {
        visible = visible.filter(task => task.completed);
    }

    const priorityRank = { High: 3, Medium: 2, Low: 1 };

    if (sort === "priority") {
        visible.sort((a, b) =>
            priorityRank[b.priority] - priorityRank[a.priority] ||
            b.createdAt - a.createdAt
        );
    } else if (sort === "dueDate") {
        visible.sort((a, b) => {
            if (!a.dueDate && !b.dueDate) return b.createdAt - a.createdAt;
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return a.dueDate.localeCompare(b.dueDate);
        });
    } else if (sort === "name") {
        visible.sort((a, b) =>
            a.text.localeCompare(b.text, undefined, {
                sensitivity: "base"
            })
        );
    } else {
        visible.sort((a, b) => b.createdAt - a.createdAt);
    }

    return visible;
}

/* Update dashboard, task list, and progress bars. */
function render() {
    const total = tasks.length;
    const completed = tasks.filter(task => task.completed).length;
    const pending = total - completed;
    const percentage = total === 0
        ? 0
        : Math.round((completed / total) * 100);

    document.getElementById("totalCount").textContent = total;
    document.getElementById("completedCount").textContent = completed;
    document.getElementById("pendingCount").textContent = pending;
    document.getElementById("progressText").textContent =
        percentage + "% completed";

    document.getElementById("progressFill").style.width = percentage + "%";
    document.getElementById("progressBar").setAttribute(
        "aria-valuenow",
        percentage
    );

    const counts = {
        High: tasks.filter(task => task.priority === "High").length,
        Medium: tasks.filter(task => task.priority === "Medium").length,
        Low: tasks.filter(task => task.priority === "Low").length
    };

    document.getElementById("highCount").textContent = counts.High;
    document.getElementById("mediumCount").textContent = counts.Medium;
    document.getElementById("lowCount").textContent = counts.Low;

    document.getElementById("highBar").style.width =
        (total ? counts.High / total * 100 : 0) + "%";
    document.getElementById("mediumBar").style.width =
        (total ? counts.Medium / total * 100 : 0) + "%";
    document.getElementById("lowBar").style.width =
        (total ? counts.Low / total * 100 : 0) + "%";

    const visible = getVisibleTasks();
    taskList.replaceChildren();

    document.getElementById("resultCount").textContent =
        "Showing " + visible.length + " of " + total + " tasks";

    if (visible.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = total === 0
            ? "No tasks yet. Add your first task above!"
            : "No tasks match your search or selected filter.";
        taskList.appendChild(empty);
        return;
    }

    visible.forEach(task => {
        taskList.appendChild(createTaskElement(task));
    });
}

searchInput.addEventListener("input", render);
filterInput.addEventListener("change", render);
sortInput.addEventListener("change", render);

/* CSV export with safe quoting and spreadsheet formula protection. */
function csvCell(value) {
    let text = String(value ?? "");

    if (/^[\s]*[=+\-@]/.test(text)) {
        text = "'" + text;
    }

    return '"' + text.replace(/"/g, '""') + '"';
}

document.getElementById("exportBtn").addEventListener("click", function () {
    if (tasks.length === 0) {
        alert("There are no tasks to export.");
        return;
    }

    const rows = [
        [
            "Task Name",
            "Priority",
            "Due Date",
            "Status",
            "Created Date"
        ]
    ];

    tasks.forEach(task => {
        rows.push([
            task.text,
            task.priority,
            task.dueDate || "Not set",
            task.completed ? "Completed" : "Pending",
            new Date(task.createdAt).toLocaleDateString("en-IN")
        ]);
    });

    const csv = rows
        .map(row => row.map(csvCell).join(","))
        .join("\r\n");

    const blob = new Blob(["\uFEFF" + csv], {
        type: "text/csv;charset=utf-8;"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "taskflow_tasks.csv";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
});

/* Initial page setup. */
applyTheme();
render();
</script>
</body>
</html>
