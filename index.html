
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Manager</title>

    <style>
        body {
            background-color: #eaf2ff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            color: #173b75;
        }

        .task-container {
            max-width: 550px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px #00000012;
        }

        form {
            display: flex;
            gap: 8px;
        }

        #taskInput {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            padding: 10px 14px;
            background: #2457a7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #173b75;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            padding: 12px;
            background: #f1f5f9;
            border-radius: 6px;
            text-align: left;
        }

        .task-text {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .completed {
            text-decoration: line-through;
            color: #64748b;
        }

        .delete-button {
            background: #c62828;
        }

        #emptyMessage {
            color: #64748b;
        }

        @media (max-width: 420px) {
            body {
                padding: 20px 12px;
            }

            .task-container {
                padding: 16px;
            }

            form {
                flex-wrap: wrap;
            }

            #taskInput {
                flex-basis: 100%;
            }
        }
    </style>
</head>

<body>
    <h1>My Task Manager</h1>
    <p>Organize your work. Complete your goals.</p>

    <main class="task-container">
        <h2>My Tasks</h2>

        <form id="taskForm">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
                aria-label="New task"
                maxlength="200"
            >
            <button type="submit">Add Task</button>
        </form>

        <p id="taskCount">0 tasks · 0 completed</p>
        <ul id="taskList"></ul>
        <p id="emptyMessage">No tasks yet. Add your first task!</p>
    </main>

    <script>
        const taskForm = document.getElementById("taskForm");
        const taskInput = document.getElementById("taskInput");
        const taskList = document.getElementById("taskList");
        const taskCount = document.getElementById("taskCount");
        const emptyMessage = document.getElementById("emptyMessage");

        function loadTasks() {
            try {
                const saved = localStorage.getItem("myTaskManagerTasks");
                const parsed = saved ? JSON.parse(saved) : [];

                if (!Array.isArray(parsed)) {
                    return [];
                }

                return parsed.filter(function(task) {
                    return task &&
                        typeof task.id === "number" &&
                        typeof task.text === "string" &&
                        typeof task.completed === "boolean";
                });
            } catch (error) {
                return [];
            }
        }

        let tasks = loadTasks();

        function saveTasks() {
            try {
                localStorage.setItem(
                    "myTaskManagerTasks",
                    JSON.stringify(tasks)
                );
            } catch (error) {
                alert("Could not save tasks in this browser.");
            }
        }

        function renderTasks() {
            taskList.replaceChildren();

            tasks.forEach(function(task) {
                const li = document.createElement("li");

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = task.completed;
                checkbox.setAttribute(
                    "aria-label",
                    "Mark " + task.text + " as completed"
                );

                checkbox.addEventListener("change", function() {
                    task.completed = checkbox.checked;
                    saveTasks();
                    renderTasks();
                });

                const taskText = document.createElement("span");
                taskText.className = "task-text";
                taskText.textContent = task.text;

                if (task.completed) {
                    taskText.classList.add("completed");
                }

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.textContent = "Delete";
                deleteButton.className = "delete-button";

                deleteButton.addEventListener("click", function() {
                    tasks = tasks.filter(function(item) {
                        return item.id !== task.id;
                    });

                    saveTasks();
                    renderTasks();
                });

                li.append(checkbox, taskText, deleteButton);
                taskList.appendChild(li);
            });

            const total = tasks.length;
            const completed = tasks.filter(function(task) {
                return task.completed;
            }).length;

            taskCount.textContent =
                total + " tasks · " + completed + " completed";

            emptyMessage.hidden = total !== 0;
        }

        taskForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const text = taskInput.value.trim();

            if (text === "") {
                alert("Please enter a task!");
                taskInput.focus();
                return;
            }

            tasks.push({
                id: Date.now() + Math.random(),
                text: text,
                completed: false
            });

            saveTasks();
            renderTasks();

            taskInput.value = "";
            taskInput.focus();
        });

        renderTasks();
    </script>
</body>
</html>
