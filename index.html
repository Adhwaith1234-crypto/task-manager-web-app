
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow | Smart Task Manager</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 1000px;
      margin: 35px auto;
    }

    header {
      background: linear-gradient(135deg, #1d4ed8, #7c3aed);
      color: white;
      padding: 30px;
      border-radius: 18px;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    header p {
      color: #e0e7ff;
      line-height: 1.6;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card, .progress-card, .panel {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(15, 23, 42, 0.05);
    }

    .stat-card p {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .stat-card h2 {
      font-size: 30px;
    }

    .stat-card.total { border-top: 4px solid #3b82f6; }
    .stat-card.completed { border-top: 4px solid #16a34a; }
    .stat-card.pending { border-top: 4px solid #f59e0b; }

    .progress-card {
      margin-bottom: 20px;
    }

    .progress-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .progress-heading h2 {
      font-size: 19px;
    }

    #percentage {
      font-size: 24px;
      font-weight: bold;
      color: #2563eb;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      background: #e2e8f0;
      border-radius: 20px;
      overflow: hidden;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #16a34a);
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    #progressMessage {
      color: #64748b;
      font-size: 14px;
      margin-top: 12px;
    }

    .panel {
      margin-bottom: 20px;
    }

    .panel h2 {
      font-size: 20px;
      margin-bottom: 18px;
    }

    .task-form {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 10px;
    }

    input, select, button {
      font: inherit;
      border-radius: 8px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      background: white;
      color: #1e293b;
      min-width: 0;
    }

    input:focus, select:focus {
      outline: 2px solid #93c5fd;
      border-color: #2563eb;
    }

    button {
      padding: 11px 15px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.85;
    }

    .primary-btn {
      background: #2563eb;
      color: white;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .filter-btn {
      background: #e2e8f0;
      color: #334155;
      font-size: 13px;
    }

    .filter-btn.active {
      background: #2563eb;
      color: white;
    }

    #taskList {
      display: grid;
      gap: 12px;
    }

    .task {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 16px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: white;
    }

    .task-check {
      width: 18px;
      height: 18px;
      margin-top: 3px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .task-info {
      flex: 1;
      min-width: 0;
    }

    .task-title {
      font-weight: bold;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 9px;
      align-items: center;
    }

    .tag {
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 12px;
      background: #f1f5f9;
      color: #475569;
    }

    .priority-High {
      background: #fee2e2;
      color: #b91c1c;
    }

    .priority-Medium {
      background: #fef3c7;
      color: #92400e;
    }

    .priority-Low {
      background: #dcfce7;
      color: #166534;
    }

    .status-overdue {
      background: #fee2e2;
      color: #b91c1c;
    }

    .status-today {
      background: #ffedd5;
      color: #9a3412;
    }

    .status-upcoming {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status-completed {
      background: #dcfce7;
      color: #166534;
    }

    .completed-task .task-title {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .task-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .edit-btn {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .delete-btn {
      background: #fee2e2;
      color: #b91c1c;
    }

    .empty-state {
      padding: 30px 10px;
      text-align: center;
      color: #64748b;
      line-height: 1.7;
    }

    .edit-panel {
      margin-top: 12px;
    }

    .secondary-btn {
      background: #e2e8f0;
      color: #334155;
    }

    footer {
      text-align: center;
      padding: 12px;
      color: #64748b;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .dashboard {
        grid-template-columns: 1fr;
      }

      .task-form, .controls {
        grid-template-columns: 1fr;
      }

      .task {
        flex-wrap: wrap;
      }

      .task-actions {
        width: 100%;
        padding-left: 30px;
      }

      header h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>TaskFlow</h1>
      <p>Plan your work. Track your progress. Achieve your goals.</p>
    </header>

    <section class="dashboard" aria-label="Task statistics">
      <div class="stat-card total">
        <p>Total Tasks</p>
        <h2 id="totalTasks">0</h2>
      </div>
      <div class="stat-card completed">
        <p>Completed</p>
        <h2 id="completedTasks">0</h2>
      </div>
      <div class="stat-card pending">
        <p>Pending</p>
        <h2 id="pendingTasks">0</h2>
      </div>
    </section>

    <section class="progress-card">
      <div class="progress-heading">
        <h2>Overall Progress</h2>
        <span id="percentage">0%</span>
      </div>
      <div
        class="progress-track"
        id="progressTrack"
        role="progressbar"
        aria-label="Task completion progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div id="progressBar"></div>
      </div>
      <p id="progressMessage" aria-live="polite">
        Add a task to start tracking your progress.
      </p>
    </section>

    <section class="panel">
      <h2 id="formHeading">Add a New Task</h2>
      <form id="taskForm" class="task-form">
        <input
          id="taskInput"
          type="text"
          maxlength="200"
          placeholder="What do you need to do?"
          aria-label="Task name"
          required
        >
        <select id="priorityInput" aria-label="Task priority">
          <option value="Low">Low Priority</option>
          <option value="Medium" selected>Medium Priority</option>
          <option value="High">High Priority</option>
        </select>
        <input id="dateInput" type="date" aria-label="Due date">
        <button class="primary-btn" id="submitBtn" type="submit">
          Add Task
        </button>
      </form>
    </section>

    <section class="panel">
      <h2>Your Tasks</h2>

      <div class="controls">
        <input
          id="searchInput"
          type="search"
          placeholder="Search tasks..."
          aria-label="Search tasks"
        >
        <select id="sortInput" aria-label="Sort tasks">
          <option value="created">Recently Added</option>
          <option value="priority">Priority: High to Low</option>
          <option value="dueDate">Due Date: Earliest First</option>
          <option value="name">Task Name: A–Z</option>
        </select>
      </div>

      <div class="filters" aria-label="Filter tasks">
        <button class="filter-btn active" data-filter="all" type="button">All</button>
        <button class="filter-btn" data-filter="pending" type="button">Pending</button>
        <button class="filter-btn" data-filter="completed" type="button">Completed</button>
      </div>

      <div id="taskList"></div>
    </section>

    <footer>
      TaskFlow — built to make everyday productivity simpler.
    </footer>
  </main>

  <script>
    const STORAGE_KEY = "myTaskManagerTasks";

    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const priorityInput = document.getElementById("priorityInput");
    const dateInput = document.getElementById("dateInput");
    const searchInput = document.getElementById("searchInput");
    const sortInput = document.getElementById("sortInput");
    const taskList = document.getElementById("taskList");

    const totalTasksEl = document.getElementById("totalTasks");
    const completedTasksEl = document.getElementById("completedTasks");
    const pendingTasksEl = document.getElementById("pendingTasks");
    const percentageEl = document.getElementById("percentage");
    const progressBar = document.getElementById("progressBar");
    const progressTrack = document.getElementById("progressTrack");
    const progressMessage = document.getElementById("progressMessage");
    const formHeading = document.getElementById("formHeading");
    const submitBtn = document.getElementById("submitBtn");

    let currentFilter = "all";
    let editingId = null;
    let tasks = loadTasks();

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

        if (!Array.isArray(saved)) return [];

        return saved
          .filter(task => task && typeof task === "object")
          .map((task, index) => ({
            id: task.id ?? (Date.now() + index),
            text: String(task.text ?? ""),
            completed: Boolean(task.completed),
            priority: ["High", "Medium", "Low"].includes(task.priority)
              ? task.priority : "Medium",
            dueDate: String(task.dueDate ?? ""),
            createdAt: Number(task.createdAt) || index
          }))
          .filter(task => task.text.trim() !== "");
      } catch (error) {
        console.error("Could not load saved tasks:", error);
        return [];
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (error) {
        alert("Changes could not be saved in this browser.");
        console.error("Could not save tasks:", error);
      }
    }

    // Format today's date using local time, not UTC.
    function getTodayString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function getDueStatus(task) {
      if (task.completed) {
        return { text: "Completed", className: "status-completed" };
      }

      if (!task.dueDate) {
        return null;
      }

      const today = getTodayString();

      if (task.dueDate < today) {
        return { text: "Overdue", className: "status-overdue" };
      }

      if (task.dueDate === today) {
        return { text: "Due Today", className: "status-today" };
      }

      return { text: "Upcoming", className: "status-upcoming" };
    }

    function updateDashboard() {
      const total = tasks.length;
      const completed = tasks.filter(task => task.completed).length;
      const pending = total - completed;
      const percentage = total === 0
        ? 0
        : Math.round((completed / total) * 100);

      totalTasksEl.textContent = total;
      completedTasksEl.textContent = completed;
      pendingTasksEl.textContent = pending;
      percentageEl.textContent = percentage + "%";
      progressBar.style.width = percentage + "%";
      progressTrack.setAttribute("aria-valuenow", percentage);

      if (total === 0) {
        progressMessage.textContent =
          "Add a task to start tracking your progress.";
      } else if (percentage === 100) {
        progressMessage.textContent =
          "Amazing! All your tasks are completed!";
      } else if (percentage >= 75) {
        progressMessage.textContent =
          "Excellent progress! You're almost there.";
      } else if (percentage >= 40) {
        progressMessage.textContent =
          "Good work! Keep going to reach your goal.";
      } else if (completed > 0) {
        progressMessage.textContent =
          "Great start! Every completed task counts.";
      } else {
        progressMessage.textContent =
          "Complete a task to start making progress.";
      }
    }

    function createTag(text, className = "") {
      const tag = document.createElement("span");
      tag.className = "tag " + className;
      tag.textContent = text;
      return tag;
    }

    function renderTasks() {
      updateDashboard();
      taskList.replaceChildren();

      const searchTerm = searchInput.value.trim().toLowerCase();

      const visibleTasks = tasks.filter(task => {
        const matchesSearch = task.text.toLowerCase().includes(searchTerm);
        const matchesFilter =
          currentFilter === "all" ||
          (currentFilter === "pending" && !task.completed) ||
          (currentFilter === "completed" && task.completed);

        return matchesSearch && matchesFilter;
      });

      const priorityRank = { High: 0, Medium: 1, Low: 2 };

      visibleTasks.sort((a, b) => {
        switch (sortInput.value) {
          case "priority":
            return priorityRank[a.priority] - priorityRank[b.priority]
              || b.createdAt - a.createdAt;

          case "dueDate":
            if (!a.dueDate && !b.dueDate) return 0;
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return a.dueDate.localeCompare(b.dueDate);

          case "name":
            return a.text.localeCompare(b.text, undefined, {
              sensitivity: "base"
            });

          default:
            return b.createdAt - a.createdAt;
        }
      });

      if (visibleTasks.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = tasks.length === 0
          ? "No tasks yet. Add your first task above!"
          : "No tasks match your search or selected filter.";
        taskList.appendChild(empty);
        return;
      }

      visibleTasks.forEach(task => {
        const card = document.createElement("article");
        card.className = "task";

        if (task.completed) {
          card.classList.add("completed-task");
        }

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "task-check";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", "Mark task completed");

        checkbox.addEventListener("change", () => {
          updateTask(task.id, { completed: checkbox.checked });
        });

        const info = document.createElement("div");
        info.className = "task-info";

        const title = document.createElement("div");
        title.className = "task-title";
        title.textContent = task.text;
        info.appendChild(title);

        const meta = document.createElement("div");
        meta.className = "task-meta";

        meta.appendChild(
          createTag(task.priority + " Priority", "priority-" + task.priority)
        );

        if (task.dueDate) {
          meta.appendChild(createTag("Due: " + task.dueDate));
        }

        const status = getDueStatus(task);

        if (status) {
          meta.appendChild(createTag(status.text, status.className));
        } else {
          meta.appendChild(createTag("No Deadline"));
        }

        info.appendChild(meta);

        const actions = document.createElement("div");
        actions.className = "task-actions";

        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "edit-btn";
        editBtn.textContent = "Edit";
        editBtn.addEventListener("click", () => startEditing(task));

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "Delete";
        deleteBtn.addEventListener("click", () => deleteTask(task.id));

        actions.append(editBtn, deleteBtn);
        card.append(checkbox, info, actions);
        taskList.appendChild(card);
      });
    }

    function updateTask(id, changes) {
      tasks = tasks.map(task =>
        task.id === id ? { ...task, ...changes } : task
      );

      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);

      if (editingId === id) {
        resetForm();
        return;
      }

      saveTasks();
      renderTasks();
    }

    function startEditing(task) {
      editingId = task.id;
      taskInput.value = task.text;
      priorityInput.value = task.priority;
      dateInput.value = task.dueDate;
      formHeading.textContent = "Edit Task";
      submitBtn.textContent = "Save Changes";

      taskForm.scrollIntoView({ behavior: "smooth", block: "center" });
      taskInput.focus();
    }

    function resetForm() {
      editingId = null;
      taskForm.reset();
      priorityInput.value = "Medium";
      formHeading.textContent = "Add a New Task";
      submitBtn.textContent = "Add Task";
      renderTasks();
    }

    taskForm.addEventListener("submit", event => {
      event.preventDefault();

      const text = taskInput.value.trim();

      if (!text) {
        alert("Please enter a task name.");
        return;
      }

      if (editingId !== null) {
        const id = editingId;

        tasks = tasks.map(task =>
          task.id === id
            ? {
                ...task,
                text,
                priority: priorityInput.value,
                dueDate: dateInput.value
              }
            : task
        );

        editingId = null;
      } else {
        tasks.push({
          id: Date.now() + Math.random(),
          text,
          completed: false,
          priority: priorityInput.value,
          dueDate: dateInput.value,
          createdAt: Date.now()
        });
      }

      saveTasks();
      taskForm.reset();
      priorityInput.value = "Medium";
      formHeading.textContent = "Add a New Task";
      submitBtn.textContent = "Add Task";
      renderTasks();
      taskInput.focus();
    });

    searchInput.addEventListener("input", renderTasks);
    sortInput.addEventListener("change", renderTasks);

    document.querySelectorAll(".filter-btn").forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;

        document.querySelectorAll(".filter-btn").forEach(btn => {
          btn.classList.toggle("active", btn === button);
        });

        renderTasks();
      });
    });

    renderTasks();
  </script>
</body>
</html>
